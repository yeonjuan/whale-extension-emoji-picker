<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: white;
      }
      h1 {
        text-align: center;
        font-size: 20px;
      }
      #tabs {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        border: solid #e1e4e8;
        border-width: 0px 0px 1px 0px;
      }

      #tabs li {
        width: 100%;
      }
      #tabs li button {
        cursor: pointer;
        background: white;
        display: inline-block;
        position: relative;
        width: 100%;
        padding-top: 4px;
        padding-bottom: 4px;
        font-size: 1rem;
        font-weight: 600;
        line-height: 20px;
        color: #586069;
        border: solid #e1e4e8;
        border-width: 1px 0px 0px 1px;
        font-size: 12px;
      }
      #tabs button.selected {
        background: #0366d6;
        border-color: #0366d6;
        color: #fff;
        z-index: 2;
      }
      #tabs button.selected:hover {
        background: #0366d6;
        border-color: #0366d6;
        color: #fff;
      }

      input {
        margin: 0 auto;
        display: block;
        width: 80%;
        font-size: 18px;
        padding: 2px;
      }
      li {
        display: table-cell;
        width: 25%;
        text-align: center;
        display: block;
      }
      #search-result li {
        width: 10%;
      }

      #emoji-list {
        padding: 10px;
        width: 100%;
        display: grid;
        margin-top: 0px;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
      }
      #emoji-list li {
        width: 100%;
      }
      #emoji-list li button {
        border: none;
        background: none;
        width: 100%;
        cursor: pointer;
        font-size: 24px;
        padding: 2px;
        border: 1px solid transparent;
      }
      #emoji-list button:hover {
        border: 1px solid #0366d6;
        border-radius: 10px;
        background: #f6f8fa;
      }
      li button:hover,
      #tabs button.unselected:hover {
        background: #f6f8fa;
        z-index: 2;
      }

      h1 {
        background: white;
        margin: 0;
        padding-top: 20px;
        padding-bottom: 20px;
        color: #24292e;
        font-weight: 600;
      }

      #toast {
        background-color: #0366d6;
        color: #fff;
        text-align: center;
        border-radius: 2px;
        padding: 16px;
        align-items: center;
        border-radius: 25px;
        bottom: 0px;
        display: flex;
        min-height: 50px;
        max-height: 50px;
        justify-content: space-between;
        left: 50%;
        padding: 0 20px;
        position: fixed;
        transform: translateX(-50%) translateY(150%);
        transition: transform 0.35s ease;
        font-size: 20px;
      }

      #toast.show {
        transform: translateX(-50%) translateY(-50%);
      }
      .search-container {
        position: relative;
        display: flex;
        padding-bottom: 20px;
        width: 100%;
      }
    </style>
    <!-- prettier-ignore -->

     </style>
  </head>
  <body>
    <div>
      <div class="App">
        <div id="top" style="position: fixed; width: 100%; background: #fff">
          <h1>이모지 피커 <span>v2</span></h1>
          <div class="search-container">
            <input id="search" placeholder="검색" />
          </div>
          <ul id="tabs">
            <li><button class="unselected" data-value="0">표정</button></li>
            <li>
              <button class="unselected" data-value="1">사람과 판타지</button>
            </li>
            <li>
              <button class="unselected" data-value="2">옷과 장신구</button>
            </li>
            <li>
              <button class="unselected" data-value="3">Pale</button>
            </li>
            <li>
              <button class="selected" data-value="4">Cream White</button>
            </li>
            <li>
              <button class="unselected" data-value="5">Brown</button>
            </li>
            <li>
              <button class="unselected" data-value="6">Dark Brown</button>
            </li>
            <li>
              <button class="unselected" data-value="7">Black</button>
            </li>
            <li>
              <button class="unselected" data-value="8">동물과 자연</button>
            </li>
            <li>
              <button class="unselected" data-value="9">음식</button>
            </li>
            <li>
              <button class="unselected" data-value="10">활동과 스포츠</button>
            </li>
            <li>
              <button class="unselected" data-value="11">여행과 장소</button>
            </li>
            <li>
              <button class="unselected" data-value="12">물건</button>
            </li>
            <li>
              <button class="unselected" data-value="13">상징</button>
            </li>
            <li>
              <button class="unselected" data-value="14">국기</button>
            </li>
            <li>
              <button class="unselected" data-value="15">탈것</button>
            </li>
          </ul>
        </div>

        <div id="content">
          <ul id="emoji-list"></ul>
        </div>
      </div>
    </div>
    <script src="./toastify.js"></script>
    <script src="./fuse.js"></script>
    <script src="./emojis.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
