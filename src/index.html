    <script>
      const categoryMap = {
        0: "표정",
        1: "사람과 판타지",
        2: "옷과 장신구",
        3: "Pale",
        4: "Cream White",
        5: "Brown",
        6: "Dark Brown",
        7: "Black",
        8: "동물과 자연",
        9: "음식",
        10: "활동과 스포츠",
        11: "여행과 장소",
        12: "물건",
        13: "상징",
        14: "국기",
        15: "탈것",
      };

      const state = (function () {
        const obj = {
          currentTab: 0,
          _listeners: [],
          changeTab(value) {
            this.currentTab = value;
            this._listeners.forEach((listener) => listener(value));
          },
          onChangeTab(listener) {
            this._listeners.push(listener);
          },
        };
        return obj;
      })();

      function categoryTabHtml() {
        let html = "";
        for (const [value, displayName] of Object.entries(categoryMap)) {
          html += `<button data-value="${value}">${displayName}</button>`;
        }
        return html;
      }

      function emojiTableHtml() {
        let html = "";
        const emojiList = window.emojidata[state.currentTab];
        for (const emoji of emojiList) {
          html += `<button data-value="${emoji.ch}">${emoji.ch}</button>`;
        }
        return html;
      }

      function renderSearchResult(result) {
        console.log(result);
        let html = "";
        for (const r of result) {
          html += `<button data-value="${r.item.ch}">${r.item.ch}</button>`;
        }
        return html;
      }

      const copyToClipboard = (content) => {
        const textField = document.createElement("textarea");
        textField.innerText = content;
        document.body.appendChild(textField);
        textField.select();
        document.execCommand("copy");
        textField.remove();
      };

      const $categoryTab = document.getElementById("category-tab");
      $categoryTab.innerHTML = categoryTabHtml();
      $categoryTab.addEventListener("click", (tab) => {
        state.changeTab(Number(tab.target.dataset.value));
      });

      const $emojiTable = document.getElementById("emoji-table");
      state.onChangeTab(() => {
        $emojiTable.innerHTML = emojiTableHtml();
      });
      $emojiTable.addEventListener("click", (event) => {
        copyToClipboard(event.target.dataset.value);
      });

      state.changeTab(state.currentTab);

      const $search = document.getElementById("search");
      const flatten = window.emojidata.reduce(function (a, b) {
        return a.concat(b);
      }, []);

      const fuse = new Fuse(flatten, {
        keys: ["n.en", "n.ko"],
        threshold: 0.6,
        shouldSort: true,
      });
      function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            func.apply(this, args);
          }, timeout);
        };
      }
      const $searchResult = document.getElementById("search-result");
      const onInput = debounce((event) => {
        $searchResult.innerHTML = renderSearchResult(
          fuse.search(event.target.value, { limit: 16 }),
        );
      });
      $search.addEventListener("input", onInput);
    </script>
